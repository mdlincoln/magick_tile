name: pytest
on: pull_request

jobs:
  pytest:
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup ImageMagick
        run: sudo apt-get install -y imagemagick
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: mypy
        run: uv run mypy .
      - name: Pytest
        # pipefail so a failing test run is not masked by the tee exit status
        shell: bash -eo pipefail {0}
        run: uv run pytest --junitxml=pytest.xml --cov=magick_tile --cov-report=term-missing:skip-covered | tee pytest-coverage.txt
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
