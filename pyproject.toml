[project]
name = "magick_tile"
version = "0.4.0"
description = "Use Imagemagick to efficiently create derivative tiles of a very large image, and structure them into directories compliant with IIIF Level 0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
keywords = ["iiif"]
authors = [{ name = "Matthew Lincoln", email = "matthew.d.lincoln@gmail.com" }]
dependencies = [
    "pydantic>=2.14.1,<3",
    # BaseSettings moved out of pydantic in v2. 2.16+ requires Python >=3.11,
    # and this project still supports 3.10, so stay on the 2.15 line.
    "pydantic-settings>=2.15.0,<2.16",
    # typer 0.26+ vendors Click, so click is no longer a dependency and the
    # old click cap (for typer 0.6's pre-8.2 make_metavar call) is gone.
    "typer>=0.27.3,<0.28",
]

[project.scripts]
magick_tile = "magick_tile.main:app"

[project.urls]
Repository = "https://github.com/mdlincoln/magick-tile"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pytest-cov>=3.0.0,<4",
    "pytest-subprocess>=1.4.2,<2",
    "ruff>=0.17.2,<0.18",
    "ty>=0.0.91,<0.1",
]
# The browser end-to-end suite in e2e/ needs Playwright; keeping it out of the
# dev group keeps the default test run unit-only.
e2e = ["pytest-playwright>=0.10,<0.11"]

[tool.pytest.ini_options]
# The default run is unit-only; `uv run --group e2e pytest e2e` overrides this
# with an explicit path.
testpaths = ["tests"]
# `e2e` is a source tree, not an installed package, and `tests/` has no
# __init__.py, so pytest's prepend import mode would put `tests/` — not the
# repository root — on sys.path and `from e2e.requests import ...` would fail at
# collection.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magick_tile"]

# hatchling's built-in ignores leave generated directories alone (an unscoped
# build ships out/ and htmlcov/), so the harness assets and generated
# directories are excluded explicitly. The wheel is already package-only.
# Each pattern is a glob on purpose: a bare directory path such as
# "/e2e/fixtures" matches nothing and silently ships the directory's contents.
[tool.hatch.build.targets.sdist]
exclude = [
    "/e2e/fixtures/**",
    # One vendor directory per viewer backend.
    "/e2e/viewer/*/vendor/**",
    "/out/**",
    "/htmlcov/**",
    "/dist/**",
    "/.playwright-mcp/**",
]

[tool.ruff]
# 88 keeps the layout the codebase was formatted at under black.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors and warnings plus pyflakes: the rule set flake8 enforced
# before ruff took over linting.
select = ["E", "W", "F"]
