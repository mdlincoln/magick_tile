[project]
name = "magick_tile"
version = "0.2.0"
description = "Use Imagemagick to efficiently create derivative tiles of a very large image, and structure them into directories compliant with IIIF Level 0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
keywords = ["iiif"]
authors = [{ name = "Matthew Lincoln", email = "matthew.d.lincoln@gmail.com" }]
dependencies = [
    "pydantic>=1.9.1,<2",
    # typer 0.26+ vendors Click, so click is no longer a dependency and the
    # old click cap (for typer 0.6's pre-8.2 make_metavar call) is gone.
    "typer>=0.27.3,<0.28",
]

[project.scripts]
magick_tile = "magick_tile.main:app"

[project.urls]
Repository = "https://github.com/mdlincoln/magick-tile"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pytest-cov>=3.0.0,<4",
    "pytest-subprocess>=1.4.2,<2",
    "ruff>=0.17.2,<0.18",
    "ty>=0.0.91,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magick_tile"]

[tool.ruff]
# 88 keeps the layout the codebase was formatted at under black.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors and warnings plus pyflakes: the rule set flake8 enforced
# before ruff took over linting.
select = ["E", "W", "F"]
