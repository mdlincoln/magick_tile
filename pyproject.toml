[project]
name = "magick_tile"
version = "0.2.0"
description = "Use Imagemagick to efficiently create derivative tiles of a very large image, and structure them into directories compliant with IIIF Level 0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
keywords = ["iiif"]
authors = [{ name = "Matthew Lincoln", email = "matthew.d.lincoln@gmail.com" }]
dependencies = [
    "pydantic>=1.9.1,<2",
    "typer[all]>=0.6.1,<0.7",
    # typer 0.6.x calls click's make_metavar() with the pre-8.2 signature, which
    # click 8.2 removed. Before this cap was declared, resolution picked up
    # click 8.5 and every CLI invocation raised TypeError.
    "click>=8.0,<8.2",
]

[project.scripts]
magick_tile = "magick_tile.main:app"

[project.urls]
Repository = "https://github.com/mdlincoln/magick-tile"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pytest-cov>=3.0.0,<4",
    "pytest-subprocess>=1.4.2,<2",
    "ruff>=0.17.2,<0.18",
    "ty>=0.0.91,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magick_tile"]

[tool.ruff]
# 88 keeps the layout the codebase was formatted at under black.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors and warnings plus pyflakes: the rule set flake8 enforced
# before ruff took over linting.
select = ["E", "W", "F"]
